# Publicación automática en GitHub Pages: cada vez que se sube (push) algo a la rama main,
# se compila el sitio (npm run build) y se publica el contenido de dist/.
# Resultado: https://sladdaga.github.io/CFL402/
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:

# Permisos mínimos que necesita el despliegue en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se hacen varios push seguidos, solo se publica el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci instala exactamente las versiones de package-lock.json.
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
